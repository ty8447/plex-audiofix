name: build
on:
  push: { branches: [main] }
  schedule: [{ cron: "17 4 * * 1" }]   # weekly rebuild picks up ffmpeg/mkvtoolnix/alpine updates
  workflow_dispatch: {}
permissions: { contents: read, packages: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "IMG=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with: { push: true, tags: "${{ env.IMG }}:latest" }
