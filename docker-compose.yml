# Alternative to the Unraid template: Compose Manager plugin or `docker compose up -d --build`
services:
  plex-audiofix:
    build: .
    image: plex-audiofix:latest
    container_name: plex-audiofix
    restart: unless-stopped
    ports:
      - 8787:8787                             # Sonarr/Radarr webhook
    environment:
      - TZ=America/New_York
      - MEDIA_DIRS=/data/media
      - PREFERRED_LANGUAGES=eng
      - DRY_RUN=true                          # flip to false once the log looks right
      - PLEX_URL=                             # e.g. http://192.168.1.10:32400
      - PLEX_TOKEN=
      - PLEX_PATH_MAP=                        # only if Plex sees media at another path, e.g. /data/media:/media
      - ARR_PATH_MAP=                         # only if Sonarr/Radarr use other paths, e.g. /tv:/data/media/tv
      - NOTIFY_URL=                           # Discord webhook or ntfy URL
    volumes:
      - /mnt/user/appdata/plex-audiofix:/config
      - /mnt/user/data:/data                  # same mapping as Sonarr/Radarr
